# Development profile configuration

# Server configuration
server.port=8080

# Conexión a PostgreSQL en Docker
spring.datasource.url=jdbc:postgresql://localhost:5432/ultra_accounting
spring.datasource.username=postgres
spring.datasource.password=postgres

# Configuración JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Enable more detailed logging
logging.level.root=INFO
logging.level.com.pluralsight=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Pretty print JSON responses
spring.jackson.serialization.indent-output=true

# Disable cache for templates and static resources for development
spring.thymeleaf.cache=false
spring.resources.cache.period=0

# Enable all endpoints for actuator
management.endpoints.web.exposure.include=*
