# Server configuration
server.port=8080

# Application name
spring.application.name=ultra-accounting-api

# Logging configuration
logging.level.root=INFO
logging.level.com.pluralsight=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Jackson configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# Path to the shared CSV ledger (used by both console app and REST API)
accounting.csv-path=/Users/tonderflash/pluralsight/LearnToCode_Capstones/ultra-accounting-ledger/transactions.csv
